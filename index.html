<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Open Minis 실행</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f172a; color: #f8fafc; }
    main { width: min(88vw, 420px); text-align: center; }
    h1 { font-size: 1.5rem; margin: 0 0 0.75rem; }
    p { color: #cbd5e1; line-height: 1.6; margin: 0 0 1.25rem; }
    a { display: block; padding: 1rem 1.25rem; border-radius: 0.9rem; background: #7c3aed; color: white; font-weight: 700; text-decoration: none; }
    small { display: block; margin-top: 1rem; color: #94a3b8; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>Open Minis를 여는 중입니다</h1>
    <p id="status">잠시만 기다려 주세요.</p>
    <a id="launch" hidden>Open Minis에서 실행</a>
    <small id="help" hidden>자동으로 열리지 않으면 위 버튼을 한 번 눌러 주세요.</small>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const prompt = params.get("text");
      const shortcutName = params.get("name") || "Minis로 브리핑 요청하기";
      const status = document.getElementById("status");
      const launch = document.getElementById("launch");
      const help = document.getElementById("help");

      if (!prompt) {
        status.textContent = "실행할 작업 내용이 없습니다.";
        return;
      }

      const shortcutUrl =
        "shortcuts://run-shortcut?name=" + encodeURIComponent(shortcutName) +
        "&input=text&text=" + encodeURIComponent(prompt);

      launch.href = shortcutUrl;
      launch.hidden = false;
      help.hidden = false;

      window.setTimeout(() => {
        window.location.replace(shortcutUrl);
      }, 50);
    })();
  </script>
</body>
</html>
